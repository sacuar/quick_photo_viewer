name: Windows installer and release
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - app.py
      - build_exe.bat
      - capture_screenshot.py
      - requirements-build.txt
      - requirements.txt
      - build_brand.py
      - '.github/workflows/windows-build.yml'
permissions:
  contents: write
jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v6
        with:
          python-version: '3.13'
      - name: Install and verify Python build dependencies
        shell: pwsh
        run: |
          python -m pip install -r requirements-build.txt
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python -c "import sys, PySide6, PIL; print(sys.executable); print(PySide6.__version__)"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - run: choco install innosetup --no-progress -y
      - shell: cmd
        run: build_installer.bat /nopause
      - name: Test packaged viewer and capture workspace
        shell: pwsh
        run: |
          $exe=Get-Item 'installer/output/QuickPhotoViewer-Setup-2.9.2.exe'
          $dist="$env:USERPROFILE/Documents/QuickPhotoViewerBuild/dist/QuickPhotoViewer"
          $p=Start-Process "$dist/QuickPhotoViewer.exe" -ArgumentList '--smoke-test' -PassThru
          if(!$p.WaitForExit(30000)){$p.Kill();throw 'Startup timeout'}
          if($p.ExitCode -ne 0){throw 'Startup failed'}
          $env:QT_QPA_PLATFORM='offscreen'
          python capture_screenshot.py
          if($LASTEXITCODE -ne 0 -or !(Test-Path workspace.png)){throw 'Screenshot failed'}
          "$((Get-FileHash $exe.FullName -Algorithm SHA256).Hash.ToLower())  $($exe.Name)" | Set-Content -Encoding ascii "$($exe.FullName).sha256"
      - uses: actions/upload-artifact@v4
        with:
          name: QuickPhotoViewer-Windows
          path: |
            installer/output/*.exe
            installer/output/*.sha256
            workspace.png
      - name: Publish release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view v2.9.2 *> $null
          if($LASTEXITCODE -eq 0){exit 0}
          gh release create v2.9.2 installer/output/QuickPhotoViewer-Setup-2.9.2.exe installer/output/QuickPhotoViewer-Setup-2.9.2.exe.sha256 workspace.png --target $env:GITHUB_SHA --title 'Quick Photo Viewer 2.9.2 - Windows Preview' --notes-file CHANGES.md
          if($LASTEXITCODE -ne 0){throw 'Publishing failed'}
