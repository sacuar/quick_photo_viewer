name: Windows installer and release
on:
  workflow_dispatch:
  pull_request:
    paths:
      - '**.py'
      - installer/**
      - '.github/workflows/windows-build.yml'
  push:
    branches: [main]
    paths:
      - app.py
      - update_check.py
      - tests/**
      - plugin_catalog.py
      - maintenance.ps1
      - build_exe.py
      - installer/**
      - build_exe.bat
      - capture_screenshot.py
      - requirements-build.txt
      - requirements.txt
      - build_brand.py
      - '.github/workflows/windows-build.yml'
permissions:
  contents: write
jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v6
        with:
          python-version: '3.13'
      - name: Install and verify Python build dependencies
        shell: pwsh
        run: |
          python -m pip install -r requirements-build.txt
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python -c "import sys, PySide6, PIL; print(sys.executable); print(PySide6.__version__)"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Test updater integrity and cancellation
        run: python -m unittest discover -s tests -p test_update_check.py
      - name: Test actual maintenance background job
        shell: powershell
        run: |
          $tokens=$null; $errors=$null
          [void][System.Management.Automation.Language.Parser]::ParseFile((Resolve-Path maintenance.ps1).Path,[ref]$tokens,[ref]$errors)
          if($errors.Count){$errors | Format-List; throw 'Invalid maintenance script'}
          powershell.exe -NoProfile -STA -ExecutionPolicy Bypass -File maintenance.ps1 -App QuickPhotoViewer -SelfTest
          if($LASTEXITCODE -ne 0){throw 'Maintenance scan failed'}
      - run: choco install innosetup --no-progress -y
      - shell: cmd
        run: build_installer.bat /nopause
      - name: Test packaged viewer and capture workspace
        shell: pwsh
        run: |
          $exe=Get-Item 'installer/output/QuickPhotoViewer-Setup-2.9.6.exe'
          $dist="$env:USERPROFILE/Documents/QuickPhotoViewerBuild/dist/QuickPhotoViewer"
          $p=Start-Process "$dist/QuickPhotoViewer.exe" -ArgumentList '--smoke-test' -PassThru
          if(!$p.WaitForExit(30000)){$p.Kill();throw 'Startup timeout'}
          if($p.ExitCode -ne 0){throw 'Startup failed'}
          $env:QT_QPA_PLATFORM='offscreen'
          $target=Join-Path $env:RUNNER_TEMP 'QPVInstalledTest'
          $setup=Start-Process $exe.FullName -ArgumentList '/VERYSILENT','/SUPPRESSMSGBOXES','/NORESTART','/SP-',('/DIR="'+$target+'"') -Wait -PassThru
          if($setup.ExitCode -ne 0){throw 'Installation failed'}
          $photo=Join-Path $env:RUNNER_TEMP 'QPV smoke photo.jpg'
          python -c "from PIL import Image; import sys; Image.new('RGB',(300,200),'blue').save(sys.argv[1])" "$photo"
          if($LASTEXITCODE -ne 0){throw 'Test image creation failed'}
          $p=Start-Process "$target/QuickPhotoViewer.exe" -ArgumentList ('"'+$photo+'"'),'--smoke-test' -PassThru
          if(!$p.WaitForExit(30000)){$p.Kill();throw 'Installed viewer startup timeout'}
          if($p.ExitCode -ne 0){throw 'Installed viewer startup failed'}
          if((Get-ItemProperty 'HKLM:\Software\BANGTools\QuickPhotoViewer').Executable -ne "$target\QuickPhotoViewer.exe"){throw 'Integration registration missing'}
          $uninstaller=Get-ChildItem $target -Filter 'unins*.exe' | Select-Object -First 1
          if(!$uninstaller){throw 'Uninstaller missing'}
          $u=Start-Process $uninstaller.FullName -ArgumentList '/VERYSILENT','/SUPPRESSMSGBOXES','/NORESTART' -Wait -PassThru
          if($u.ExitCode -ne 0 -or (Test-Path "$target/QuickPhotoViewer.exe")){throw 'Uninstall failed'}
          if(Test-Path 'HKLM:\Software\BANGTools\QuickPhotoViewer'){throw 'Integration registry not removed'}
          python capture_screenshot.py
          if($LASTEXITCODE -ne 0 -or !(Test-Path workspace.png)){throw 'Screenshot failed'}
          "$((Get-FileHash $exe.FullName -Algorithm SHA256).Hash.ToLower())  $($exe.Name)" | Set-Content -Encoding ascii "$($exe.FullName).sha256"
      - uses: actions/upload-artifact@v4
        with:
          name: QuickPhotoViewer-Windows
          path: |
            installer/output/*.exe
            installer/output/*.sha256
            workspace.png
      - name: Publish release
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view v2.9.6 *> $null
          if($LASTEXITCODE -eq 0){exit 0}
          gh release create v2.9.6 installer/output/QuickPhotoViewer-Setup-2.9.6.exe installer/output/QuickPhotoViewer-Setup-2.9.6.exe.sha256 workspace.png --target $env:GITHUB_SHA --title 'Quick Photo Viewer 2.9.6 - Windows Preview' --notes-file CHANGES.md
          if($LASTEXITCODE -ne 0){throw 'Publishing failed'}
