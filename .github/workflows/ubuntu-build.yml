name: Ubuntu 24.04 x64 package
on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'app.py'
      - 'update_check.py'
      - 'plugin_catalog.py'
      - 'requirements*.txt'
      - 'packaging/linux/**'
      - '.github/workflows/ubuntu-build.yml'
  push:
    branches: [feature/ubuntu-2404, main]
    paths:
      - 'app.py'
      - 'requirements*.txt'
      - 'packaging/linux/**'
      - '.github/workflows/ubuntu-build.yml'
permissions:
  contents: read
jobs:
  ubuntu:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Install Qt runtime libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y libegl1 libgl1 libxcb-cursor0 libxkbcommon-x11-0 libdbus-1-3 libxcb-xinerama0 libxcb-icccm4 libxcb-image0 libxcb-keysyms1 libxcb-render-util0 libxcb-xkb1 libxkbcommon0 libglib2.0-0 libfuse2t64
      - name: Build dependencies and syntax checks
        run: |
          python -m pip install -r requirements-build.txt
          python -m compileall -q app.py update_check.py plugin_catalog.py
      - name: Ubuntu Qt application smoke test
        env:
          QT_QPA_PLATFORM: offscreen
        run: |
          python - <<'PY'
          from PIL import Image
          Image.new('RGB', (320, 240), '#2471a3').save('/tmp/qpv-linux-smoke.jpg')
          PY
          python app.py /tmp/qpv-linux-smoke.jpg --smoke-test
      - name: Compile self-contained Ubuntu executable
        run: |
          python -m PyInstaller --noconfirm --clean --windowed --onedir --contents-directory . --name QuickPhotoViewer --add-data "icons:icons" app.py
          test -x dist/QuickPhotoViewer/QuickPhotoViewer
      - name: Test bundled executable
        env:
          QT_QPA_PLATFORM: offscreen
        run: |
          dist/QuickPhotoViewer/QuickPhotoViewer /tmp/qpv-linux-smoke.jpg --smoke-test
      - name: Create DEB and SHA-256
        run: |
          bash packaging/linux/build-deb.sh
      - uses: actions/upload-artifact@v4
        with:
          name: QuickPhotoViewer-Ubuntu-24.04-amd64
          path: |
            installer/linux/*.deb
            installer/linux/*.sha256
          if-no-files-found: error
